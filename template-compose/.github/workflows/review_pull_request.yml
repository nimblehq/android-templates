name: Review pull request

on:
  pull_request:
    types: [ opened, reopened, ready_for_review, synchronize ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review_pull_request:
    if: github.event.pull_request.draft == false
    name: Review pull request
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 100

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches/modules-*
            ~/.gradle/caches/jars-*
            ~/.gradle/caches/build-cache-*
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up JDK 17
        uses: actions/setup-java@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6 # v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Detekt
        run: ./gradlew detekt

      - name: Run Android Lint
        run: ./gradlew lint

      - name: Run unit tests with Kover
        run: ./gradlew koverXmlReportCustom

      - name: Set up Ruby
        uses: ./.github/actions/setup-ruby

      - name: Run Danger
        # Dependabot runs get a read-only token. Danger cannot post comments with it.
        if: github.actor != 'dependabot[bot]'
        env:
          DANGER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bundle exec danger

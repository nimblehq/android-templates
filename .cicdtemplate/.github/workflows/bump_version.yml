name: Bump Version

on:
  workflow_dispatch:
    inputs:
      newVersion:
        description: "Version name"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bump_version:
    name: Bump version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Bump version name
        env:
          NEW_VERSION: ${{ github.event.inputs.newVersion }}
        run: |
          if [[ ! "$NEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Version must look like 1.2.3 or 1.2.3-beta.1" >&2
            exit 1
          fi
          perl -i -pe 's/androidVersionName =.*$/androidVersionName = "$ENV{NEW_VERSION}"/' gradle/libs.versions.toml

      - name: Create pull request
        uses: peter-evans/create-pull-request@38e0b6e68b4c852a5500a94740f0e535e0d7ba54 # v4
        with:
          assignees: ${{ secrets.GITHUB_USER }}
          token: ${{ secrets.WIKI_ACTION_TOKEN }}
          commit-message: '[Chore] Bump version to ${{ github.event.inputs.newVersion }}'
          committer: Nimble Bot <bot@nimblehq.co>
          branch: chore/bump-version-to-${{ github.event.inputs.newVersion }}
          delete-branch: true
          title: '[Chore] Bump version to ${{ github.event.inputs.newVersion }}'
          labels: |
            type : chore
          body: |
            ## What happened 👀

            Bump version to ${{ github.event.inputs.newVersion }}

            ## Insight 📝

            Automatically created by the `Bump Version` workflow.

            ## Proof Of Work 📹

            On the `Files changed` tab

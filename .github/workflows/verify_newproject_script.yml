name: Verify newproject script

on:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ develop ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify_newproject_script:
    name: Verify newproject script
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6 # v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Checkout source code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches/modules-*
            ~/.gradle/caches/jars-*
            ~/.gradle/caches/build-cache-*
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Kotlin and Kscript
        run: |
          source version.properties
          curl --proto '=https' --tlsv1.2 -fsSL -o kotlin.zip \
            "https://github.com/JetBrains/kotlin/releases/download/v${kotlinVersion}/kotlin-compiler-${kotlinVersion}.zip"
          echo "${kotlinSha256}  kotlin.zip" | sha256sum -c -
          curl --proto '=https' --tlsv1.2 -fsSL -o kscript.zip \
            "https://github.com/kscripting/kscript/releases/download/v${kscriptVersion}/kscript-${kscriptVersion}-bin.zip"
          echo "${kscriptSha256}  kscript.zip" | sha256sum -c -
          unzip -q kotlin.zip -d "$HOME/kotlin"
          unzip -q kscript.zip -d "$HOME/kscript"
          rm kotlin.zip kscript.zip
          echo "$HOME/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
          echo "$HOME/kscript/kscript-${kscriptVersion}/bin" >> "$GITHUB_PATH"

      - name: Verify generating new project from template-compose
        working-directory: scripts
        run: kscript new_project.kts package-name=co.mycomposeproject.example app-name="My Compose Project" template=compose


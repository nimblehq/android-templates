name: Create the Release pull request

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create_release_pull_request:
    name: Create the Release pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the latest code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read the current version
        id: version
        uses: christian-draeger/read-properties@908f99d3334be3802ec7cb528395a69d19914e7b # 1.1.1
        with:
          path: "version.properties"
          properties: "templateScriptVersion"

      - uses: nimblehq/github-actions-workflows/create_release_pull_request@d2f913f1faba9dd814eb0cab86147d2bab6e0e34 # 0.1.10
        with:
          release_version: ${{ steps.version.outputs.templateScriptVersion }}
          changelog_configuration: ".github/workflows/config/changelog-release.json"
          assignee: bot-nimble

name: Publish docs to Wiki

on:
  push:
    paths:
      - .github/wiki/**
    branches:
      - main

permissions:
  contents: read

jobs:
  publish_docs_to_wiki:
    name: Publish docs to Wiki
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}

      - name: Publish Github Wiki
        uses: nimblehq/publish-github-wiki-action@5c5e38a4260421b215a83ad8621a51616e5c0a4c # v1.0
        with:
          user_name: team-nimblehq
          user_email: dev@nimblehq.co
          user_access_token: ${{ secrets.WIKI_ACTION_TOKEN }}
